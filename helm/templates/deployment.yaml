apiVersion: apps/v1
kind: Deployment
metadata:
  name: { { include "iels-api.fullname" . } }
  labels:
    app: { { include "iels-api.name" . } }
spec:
  replicas: 2
  selector:
    matchLabels:
      app: { { include "iels-api.name" . } }
  template:
    metadata:
      labels:
        app: { { include "iels-api.name" . } }
    spec:
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "iels-api.fullname" . }}-config
      containers:
        - name: { { include "iels-api.name" . } }
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: { { .Values.image.pullPolicy } }
          ports:
            - containerPort: { { .Values.service.port } }

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: { { .Values.env.ASPNETCORE_ENVIRONMENT } }

          readinessProbe:
            httpGet:
              path: /health
              port: { { .Values.service.port } }
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: { { .Values.service.port } }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
          resources: { { - toYaml .Values.resources | nindent 12 } }
